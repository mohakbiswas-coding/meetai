# CodeRabbit configuration for Next.js projects

reviews:
  auto_review:
    enabled: true          # ✅ previously was just "true"
    branches:
      include:
        - "*"              # allow all branches (not just main)
  review_status: false      # hide "Review skipped" messages

  level: advanced           # review depth: basic | intermediate | advanced
  comment_mode: concise     # concise | detailed

  ignore:
    - "*.lock"
    - "package-lock.json"
    - "pnpm-lock.yaml"
    - "yarn.lock"
    - "public/**"
    - ".next/**"
    - "node_modules/**"
    - "*.md"

commands:
  enabled: true
  aliases:
    review: "review --focus=code,tests,security,performance"

rules:
  - id: nextjs-imports
    description: "Ensure imports follow Next.js best practices"
    severity: medium

  - id: security
    description: "Detect potential XSS or unsafe rendering in Next.js pages"
    severity: high

  - id: accessibility
    description: "Encourage accessibility (a11y) compliance in JSX"
    severity: medium

  - id: performance
    description: "Highlight large imports, slow renders, and unoptimized images"
    severity: medium

  - id: testing
    description: "Encourage unit/integration testing and coverage"
    severity: low
